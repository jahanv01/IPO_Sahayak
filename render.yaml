services:
  - type: web
    name: ipo-sahayak-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Set this to the Vercel URL once known — until then the backend logs a
      # boot-time warning and falls back to "*" (wide-open CORS).
      - key: ALLOWED_ORIGINS
        sync: false
