name: Scraper

on:
  schedule:
    - cron: "0 4,16 * * *" # twice a day, 04:00 and 16:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: pipeline

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a stuck run shouldn't quietly burn the monthly Actions minutes budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper.py
