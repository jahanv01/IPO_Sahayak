name: Pipeline

on:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  pull_request:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
